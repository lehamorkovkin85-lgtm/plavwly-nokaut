<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plavwly Games — Ночная смена</title>
<style>
:root{color-scheme:dark;--ink:#090d17;--panel:#101827;--paper:#eaf3fa;--muted:#a7b9ca;--mint:#81ffdb;--line:#ffffff25}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font:15px system-ui,sans-serif}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
[hidden]{display:none!important}
canvas.world{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;padding:16px;
  background:linear-gradient(105deg,#070a12f4 5%,#101d30a8 63%,#0b111ba6);z-index:6}
.shell{width:min(960px,100%);display:grid;grid-template-columns:1.35fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 24px 100px #0009}
.main,.chapters,.dialog{padding:clamp(18px,4vw,38px);background:#111a2bf5}
.dialog{width:min(460px,100%);border-radius:20px;border:1px solid var(--line)}
.brand,.tag,.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:850;color:var(--mint)}
h1{font-size:clamp(34px,6vw,76px);line-height:.93;margin:16px 0;letter-spacing:-.055em}
h2{font-size:clamp(24px,4vw,39px);line-height:1.05;margin:8px 0}
p{color:var(--muted);line-height:1.45}
.primary,.secondary,select{border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--paper);background:#202e44}
.primary{background:var(--mint);color:#0a241c;font-weight:850}
.row,.settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.settings{margin-top:14px}
.settings label{display:grid;gap:4px;color:var(--muted);font-size:12px}
#hint{font-size:12px;min-height:1.45em;margin-bottom:0}
.chapter{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;text-align:left;
  width:100%;margin:7px 0;padding:9px;background:#192538;border:1px solid var(--line);border-radius:10px;color:var(--paper)}
.chapter[aria-current=true]{border-color:var(--mint);background:#12352f}
.chapter .num{font-size:22px;font-weight:900;color:#8ee9d8}
.chapter small,.chapter em{color:var(--muted);font-size:11px;font-style:normal}
.chapter strong{display:block}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#mission,#vitals,#toast{background:#0e1829df;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
#mission{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));max-width:calc(100% - 145px)}
#goal{font-weight:750;margin-top:4px}
#vitals{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:15px;min-width:153px;font-weight:800}
#vitals small{color:var(--muted);font-weight:600}
#bar{height:4px;background:#ffffff28;border-radius:3px;overflow:hidden;margin-top:5px}
#hpbar{height:100%;background:var(--mint);width:100%;transition:width .18s}
#radar{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:100px;height:100px;border-radius:13px;border:1px solid var(--line)}
#pauseBtn{position:absolute;right:12px;top:120px;pointer-events:auto;padding:7px 10px}
#toast{position:absolute;left:50%;top:67%;transform:translateX(-50%);text-align:center;color:var(--mint)}
#aim{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);border:1px solid #fff;border-radius:50%;box-shadow:0 0 5px #000}
#aim.hit{border:2px solid var(--mint);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px}
#damage{position:fixed;inset:0;pointer-events:none;z-index:3}
#touch{position:fixed;inset:0;z-index:1;pointer-events:none;user-select:none}
#look{position:absolute;inset:0 0 0 39%;pointer-events:auto;touch-action:none}
#stick{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:18px;width:98px;height:98px;
  border:1px solid #ffffff78;border-radius:50%;background:#0d1929a3;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;border-radius:50%;background:#81ffdbc2;pointer-events:none}
#actions{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));right:15px;display:flex;gap:7px;pointer-events:auto;touch-action:none}
#fire{min-height:58px}
body.mobile #vitals{left:12px;bottom:123px;font-size:13px}
@media(max-width:670px){
 .shell{grid-template-columns:1fr}.main,.chapters{padding:16px}
 .overlay{place-items:start center}.dialog{align-self:center}
 .chapters p{margin:5px 0}.chapter{padding:6px;margin:4px 0}.chapter .num{font-size:18px}
 #radar{width:75px;height:75px}#pauseBtn{top:94px}#mission{max-width:calc(100% - 106px);font-size:12px}
}
</style>
</head>
<body>
<section id="menu" class="overlay">
 <div class="shell">
  <main class="main">
   <div class="brand">Plavwly Games</div>
   <h1>Ночная<br>смена</h1>
   <div id="chapterTag" class="tag">Кампания / 01</div>
   <h2 id="chapterName"></h2>
   <p id="brief"></p>
   <div class="row">
    <button id="play" class="primary" disabled>Во весь экран</button>
    <button id="flat" class="secondary" hidden>Играть без VR</button>
   </div>
   <div class="settings">
    <label>Сложность<select id="difficulty"><option value="0">Сюжетная</option><option value="1" selected>Обычная</option><option value="2">Ветеран</option></select></label>
    <label>Графика<select id="quality"><option value="0">Плавность</option><option value="1">Детализация</option></select></label>
    <button id="mute" class="secondary" aria-pressed="false">Звук: вкл.</button>
   </div>
   <p id="hint" role="status">Загружается 3D-библиотека…</p>
  </main>
  <aside class="chapters"><div class="eyebrow">Выбор главы</div><p>Пройди миссию, чтобы открыть следующую.</p><div id="chapterList"></div></aside>
 </div>
</section>
<section id="dialog" class="overlay" hidden>
 <div class="dialog">
  <div class="brand">Plavwly Games</div><h2 id="dialogTitle"></h2><p id="dialogText"></p>
  <div class="row">
   <button id="continue" class="primary"></button>
   <button id="retry" class="secondary">Начать заново</button>
   <button id="toMenu" class="secondary">Главное меню</button>
  </div>
 </div>
</section>
<div id="hud" hidden>
 <div id="mission"><div id="missionTag" class="tag"></div><div id="goal"></div></div>
 <canvas id="radar" width="192" height="192" aria-label="Мини-карта"></canvas>
 <button id="pauseBtn" class="secondary" aria-label="Пауза">Ⅱ</button>
 <div id="aim"></div><div id="toast" hidden></div>
 <div id="vitals"><div id="vitalText"></div><div id="bar"><div id="hpbar"></div></div></div>
</div>
<div id="damage"></div>
<div id="touch" hidden>
 <div id="look"></div><div id="stick"><div id="knob"></div></div>
 <div id="actions"><button id="reload" class="secondary">Зарядить</button><button id="fire" class="primary">Огонь</button></div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
try{
 const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
 boot(T);
}catch(e){$('hint').textContent='Не удалось запустить 3D. Проверь интернет и поддержку WebGL.';console.error(e)}

function boot(T){
 const mobile=matchMedia('(any-pointer:coarse)').matches;
 document.body.classList.toggle('mobile',mobile);
 const levels=[
  {name:'Ночной рынок',sub:'Киоски и переулки',mode:'clear',
   intro:'Останови налётчиков и доберись до северных ворот. Между киосками есть короткие проходы.',
   sky:0x131b31,ground:0x34374c,wall:0x564251,accent:0xff70b2,s:[0,4],exit:[0,-5],
   blocks:[[-3,-3,2,2,5],[2,-3,2,2,7],[-3,1,2,2,4],[3,1,2,2,6],[-1,3,2,1,2.5],[1,-1,.74,.62,1.25],[-1,-1,.7,.56,1.1]],
   foes:[[-4,0,0],[4,-1,1],[0,-2,0],[4,4,0],[-4,4,1],[-4,-4,0]]},
  {name:'Грузовой порт',sub:'Контейнерный терминал',mode:'collect',
   intro:'Забери три кейса с уликами и уходи через восточные ворота. Зачищать весь терминал не обязательно.',
   sky:0x122630,ground:0x34434a,wall:0x3c6468,accent:0xffa35f,s:[0,4],exit:[5,-4],
   blocks:[[-3,-3,3,1,3.2],[2,-4,1,3,4.6],[3,1,3,1,3.2],[-2,2,1,3,3],[-2,-1,2,1,2.5],[1,0,1,2,3.2],[4,-2,1.6,.75,1.3]],
   nodes:[[-4,-2],[0,-4],[4,3]],
   foes:[[-4,4,0],[4,-1,1],[0,-2,1],[-5,0,0],[4,-4,2],[-4,-5,0],[2,4,0]]},
  {name:'Станция «Северная»',sub:'Платформы и диспетчерская',mode:'hold',
   intro:'Оставайся рядом с диспетчерским пультом 24 секунды. Если отойти, передача приостановится, но прогресс не пропадёт.',
   sky:0x17222e,ground:0x424a50,wall:0x5e7274,accent:0x85ddff,s:[0,4.5],exit:[0,-5],
   blocks:[[-4,-1,1,5,3.5],[4,-1,1,5,3.5],[-2,-2,.55,.55,4.8],[2,-2,.55,.55,4.8],[-2,1,.55,.55,4.8],[2,1,.55,.55,4.8],[0,3,3,.52,1.35]],
   nodes:[[0,0]],foes:[[0,-4,1],[-3,-3,0],[3,-3,0],[3,3,1],[-3,3,0]],
   reinforcements:[[-3,-4,0],[3,-4,1],[3,2,2],[-3,2,0]]},
  {name:'Деловой квартал',sub:'Фонтан и офисные башни',mode:'disable',
   intro:'Отключи три узла связи: задержись у каждого на две секунды. Затем выходи через западный проезд.',
   sky:0x171a35,ground:0x374458,wall:0x334f70,accent:0xa18bff,s:[0,4],exit:[-5,-4],
   blocks:[[-3,-2,2,2,14],[3,-2,2,2,18],[-3,2,2,2,11],[3,2,2,2,15],[0,0,1.35,1.35,.92],[1.6,3.4,1,.68,1.3],[-1.7,-4.2,1,.7,1.2]],
   nodes:[[-4,0],[4,0],[0,-4]],foes:[[0,-3,1],[-4,-3,0],[4,-3,1],[-5,1,0],[5,0,2],[0,-1.8,1],[4,4,0]]},
  {name:'Крыша башни',sub:'Последняя точка эвакуации',mode:'boss',
   intro:'Победи главаря и доберись до площадки эвакуации. Когда его визор вспыхнет, уйди за вентиляцию: он стреляет очередью.',
   sky:0x15182d,ground:0x444653,wall:0x5c5b71,accent:0xff637a,s:[0,4],exit:[0,-5],
   blocks:[[-3,-2,2,1,2.3],[3,-2,2,1,2.3],[-3,2,2,1,1.6],[3,2,2,1,1.6],[0,0,1.05,1.05,2],[-1.5,-4,.75,.75,1.1],[1.5,-4,.75,.75,1.1]],
   foes:[[0,-3,3],[-4,-1,1],[4,-1,1],[0,2,0],[-4,3,0],[4,3,2]]}
 ];
 const read=(k,d)=>{try{return localStorage.getItem('plavwly-'+k)??d}catch{return d}};
 const save=(k,v)=>{try{localStorage.setItem('plavwly-'+k,String(v))}catch{}};
 let unlocked=Math.min(4,Math.max(0,Number(read('unlocked',0))||0));
 let complete=read('complete','0')==='1', selected=unlocked, muted=read('mute','0')==='1';
 $('quality').value=read('quality',mobile?'0':'1');
 if(!$('quality').value)$('quality').value=mobile?'0':'1';
 $('difficulty').value=read('difficulty','1');
 if(!$('difficulty').value)$('difficulty').value='1';

 const scene=new T.Scene(), renderer=new T.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance'});
 const canvas=renderer.domElement;canvas.className='world';document.body.prepend(canvas);
 renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
 renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');
 renderer.shadowMap.type=T.PCFSoftShadowMap;
 const rig=new T.Group();scene.add(rig);
 const cam=new T.PerspectiveCamera(66,1,.045,160);cam.rotation.order='YXZ';cam.position.y=1.64;rig.add(cam);
 const hemi=new T.HemisphereLight(0xcadfff,0x685573,1.7);scene.add(hemi);
 const key=new T.DirectionalLight(0xc6daff,2.15);
 key.position.set(-23,32,14);key.castShadow=true;
 Object.assign(key.shadow.camera,{left:-33,right:33,top:33,bottom:-33,near:1,far:95});
 key.shadow.mapSize.set(1024,1024);key.shadow.normalBias=.045;key.shadow.bias=-.00018;
 scene.add(key,key.target);
 const fill=new T.DirectionalLight(0xffaa81,.45);fill.position.set(16,7,-24);scene.add(fill);
 const quality=()=>$('quality').value==='1';
 function resize(){
  if(renderer.xr.isPresenting)return;
  renderer.setPixelRatio(Math.min(devicePixelRatio,quality()?(mobile?1.55:2):1));
  renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/Math.max(1,innerHeight);cam.updateProjectionMatrix();
 }
 addEventListener('resize',resize);
 function renderQuality(){
  renderer.shadowMap.enabled=quality();key.castShadow=quality();
  if(rain)rain.visible=quality();resize();
 }

 const G={box:new T.BoxGeometry(),ball:new T.SphereGeometry(1,12,8),
  cyl:new T.CylinderGeometry(1,1,1,12),cap:new T.CapsuleGeometry(1,1,4,9),
  ring:new T.TorusGeometry(1,.06,6,36),plane:new T.PlaneGeometry()};
 const mat=(color,roughness=.75,metalness=.05)=>new T.MeshStandardMaterial({color,roughness,metalness});
 const glow=color=>new T.MeshBasicMaterial({color});
 const M={steel:mat(0x768297,.37,.55),trim:mat(0x263142,.52,.25),rubber:mat(0x171b25),
  pane:mat(0x3b6881,.21,.46),warm:glow(0xffca85),white:glow(0xd1f4ff),
  red:glow(0xff514e),black:mat(0x171e2c),mint:glow(0x85ffdf),gold:glow(0xffdb7a),
  cloth:[mat(0xa24e52),mat(0x39798f),mat(0x807484),mat(0x853a61)],
  mask:mat(0x323c4e),sole:mat(0x1b1d22)};
 function texture(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;
 }
 let seed=31;
 function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 const asphalt=texture(192,192,(c,w,h)=>{
  c.fillStyle='#a0a5b0';c.fillRect(0,0,w,h);
  for(let i=0;i<3800;i++){
   c.fillStyle=rnd()<.5?'#15213728':'#ffffff38';c.fillRect(rnd()*w,rnd()*h,1+rnd()*4,1+rnd()*2);
  }
  for(let i=0;i<25;i++){c.fillStyle='#24304325';c.fillRect(rnd()*w,rnd()*h,15+rnd()*30,1)}
 });
 asphalt.wrapS=asphalt.wrapT=T.RepeatWrapping;asphalt.repeat.set(16,16);
 const wallTextures=levels.map((_,n)=>texture(192,192,(c,w,h)=>{
  c.fillStyle='#abb5c2';c.fillRect(0,0,w,h);
  const step=n===1?12:n===3?48:24;
  for(let y=0;y<h;y+=step){
   c.fillStyle='#202b3c45';c.fillRect(0,y,w,n===1?4:2);
   for(let x=(y/step%2)*24;x<w;x+=48)c.fillRect(x,y,1,step);
  }
  for(let i=0;i<700;i++){
   c.fillStyle=rnd()<.5?'#121d2c11':'#ffffff25';c.fillRect(rnd()*w,rnd()*h,2,2);
  }
 }));
 const signMats=['МАРКЕТ','РАДИО','АТЕЛЬЕ','КАФЕ','ТЕРМИНАЛ 02','СЕВЕРНАЯ','СЕКТОР 04','ЭВАКУАЦИЯ'].map((s,n)=>{
  const map=texture(256,64,(c,w,h)=>{
   c.fillStyle='#101728';c.fillRect(0,0,w,h);c.strokeStyle=n%2?'#ff92be':'#92ffe7';
   c.lineWidth=5;c.strokeRect(3,3,w-6,h-6);c.font='bold 28px system-ui';c.fillStyle=c.strokeStyle;
   c.textAlign='center';c.textBaseline='middle';c.fillText(s,128,33,235);
  });return new T.MeshBasicMaterial({map});
 });
 const haloTex=texture(64,64,c=>{
  const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.24,'#ffffff6a');g.addColorStop(1,'#ffffff00');
  c.fillStyle=g;c.fillRect(0,0,64,64);
 });
 function group(parent,x=0,y=0,z=0){const g=new T.Group();g.position.set(x,y,z);parent.add(g);return g}
 function mesh(parent,g,m,x,y,z,sx,sy,sz,rx=0,ry=0,rz=0){
  const o=new T.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.rotation.set(rx,ry,rz);parent.add(o);return o;
 }
 const box=(p,m,x,y,z,w,h,d)=>mesh(p,G.box,m,x,y,z,w,h,d);
 function halo(p,x,y,z,c,size,opacity=.56){
  const s=new T.Sprite(new T.SpriteMaterial({map:haloTex,color:c,transparent:true,opacity,depthWrite:false,blending:T.AdditiveBlending}));
  s.position.set(x,y,z);s.scale.set(size,size,1);p.add(s);return s;
 }
 const WORLD=28, UNIT=5, N=57, TOTAL=N*N;
 let world, prop, rain, bins, markerList=[], solids=[], nodes=[], enemies=[], transients=[];
 let mapIndex=-1, level=levels[0], state='menu';
 let health=100, rounds=10, spare=60, score=0, time=0, kills=0, elapsed=0, hold=0, reinforcement=0;
 let shootAt=0,reloadEnd=0,blink=0,hitMark=0,hurtAt=0,nextRoute=0,notice='',noticeUntil=0;
 let yaw=0,pitch=0,steps=0,kick=0,exitOpen=false;
 const player=new T.Vector3(), head=new T.Vector3(0,1.64,0), headQ=new T.Quaternion();
 const up=new T.Vector3(0,1,0), tmp=new T.Vector3(), off=new T.Vector3(), move=new T.Vector3();
 const q=new T.Quaternion(), ray=new T.Raycaster(), rayBox=new T.Vector3();
 const forward=new T.Vector3(), origin=new T.Vector3(), goalPos=new T.Vector3();
 const matrixHelper=new T.Object3D();
 const pass=new Uint8Array(TOTAL), distance=new Int16Array(TOTAL), queue=new Int16Array(TOTAL);
 const initial=()=>Number($('difficulty').value);
 function put(g,m,x,y,z,sx,sy,sz,ry=0,rx=0,rz=0,shadow=true){
  const k=g.id+':'+m.id+':'+Number(shadow);
  if(!bins.has(k))bins.set(k,{g,m,shadow,matrices:[]});
  matrixHelper.position.set(x,y,z);matrixHelper.rotation.set(rx,ry,rz);
  matrixHelper.scale.set(sx,sy,sz);matrixHelper.updateMatrix();
  bins.get(k).matrices.push(matrixHelper.matrix.clone());
 }
 const B=(m,x,y,z,w,h,d,ry=0,shadow=true)=>put(G.box,m,x,y,z,w,h,d,ry,0,0,shadow);
 function flush(){
  for(const {g,m,shadow,matrices} of bins.values()){
   const o=new T.InstancedMesh(g,m,matrices.length);
   matrices.forEach((a,i)=>o.setMatrixAt(i,a));o.instanceMatrix.needsUpdate=true;
   o.castShadow=shadow;o.receiveShadow=true;prop.add(o);
  }
 }
 function disposeWorld(){
  for(const e of transients){e.o.geometry.dispose();e.o.material.dispose()}
  transients=[];
  if(!world)return;
  world.traverse(o=>{
   if(o.isInstancedMesh)o.dispose();
   if(o.isSprite)o.material.dispose();
   if(o.userData.uniqueGeometry)o.geometry.dispose();
   if(o.userData.uniqueMaterial)o.material.dispose();
  });
  for(const m of world.userData.materials)m.dispose();
  scene.remove(world);
 }
 function collider(x,z,w,d,h){
  solids.push(new T.Box3(new T.Vector3(x-w/2,0,z-d/2),new T.Vector3(x+w/2,h,z+d/2)));
 }
 function facade(x,z,w,d,h,index,i,m){
  B(m.wall,x,h/2,z,w,h,d);
  B(M.trim,x,h+.06,z,w+.22,.12,d+.22);
  if(h<1.32){
   B(M.steel,x,h+.02,z,w+.08,.07,d+.08);
   if(index===3&&i===4){
    B(M.pane,x,h+.065,z,w*.84,.045,d*.84);
    put(G.cyl,M.white,x,1.32,z,.075,.75,.075);
    halo(world,x,1.3,z,0x90dcff,1.4,.46);
   }
   return;
  }
  if(index===1){
   const long=w>d, n=Math.ceil((long?w:d)/.53);
   for(let j=0;j<n;j++){

 const beforeTurn=new T.Vector3();
 function movePlayer(dt,vr){
  let x=joy.x+Number(keys.has('KeyD')||keys.has('ArrowRight'))-
   Number(keys.has('KeyA')||keys.has('ArrowLeft'));
  let y=joy.y+Number(keys.has('KeyW')||keys.has('ArrowUp'))-
   Number(keys.has('KeyS')||keys.has('ArrowDown'));
  let angle=yaw;
  if(vr){
   const sources=Array.from(renderer.xr.getSession().inputSources);
   const left=sources.find(s=>s.handedness==='left'&&s.gamepad);
   const right=sources.find(s=>s.handedness==='right'&&s.gamepad);
   const [mx,my]=axes(left||right);
   x=mx;y=-my;
   const [rx]=axes(left?right:null);

   if(Math.abs(rx)>.65&&!snapHeld){
    beforeTurn.copy(head).applyAxisAngle(up,rig.rotation.y);
    rig.rotation.y-=Math.sign(rx)*Math.PI/6;
    off.copy(head).applyAxisAngle(up,rig.rotation.y);
    rig.position.add(beforeTurn.sub(off));
    snapHeld=true;
   }else if(Math.abs(rx)<.25)snapHeld=false;

   forward.set(0,0,-1).applyQuaternion(headQ);
   angle=rig.rotation.y+Math.atan2(-forward.x,-forward.z);
  }

  off.set(0,1.64,0);
  if(vr)off.copy(head).applyAxisAngle(up,rig.rotation.y);
  player.copy(rig.position).add(off);
  move.set(x,0,-y).divideScalar(Math.max(1,Math.hypot(x,y)));
  move.applyAxisAngle(up,angle).multiplyScalar(dt*(vr?2.65:4.55));
  const bx=rig.position.x,bz=rig.position.z;
  slide(rig.position,player.x,player.z,move.x,move.z,.32);
  steps+=Math.hypot(rig.position.x-bx,rig.position.z-bz)*2.7;
  player.copy(rig.position).add(off);
 }

    if(sees&&e.t&&!e.boss&&d<desired){
     const side=strafe[e.t]*Math.sign(Math.sin(time*1.5+e.phase)||1);
     const back=d<6?-.48:0;
     tx=p.x+(-dz*side+dx*back)/Math.max(d,.1)*2.2;
     tz=p.z+( dx*side+dz*back)/Math.max(d,.1)*2.2;
    }else if(!sees){
     const k=nearest(p.x,p.z);
     if(k>=0&&distance[k]>0){
      if(e.step<0||distance[e.step]<0||distance[e.step]>distance[k]||
       Math.hypot(cx(e.step)-p.x,cz(e.step)-p.z)<.16){
       e.step=k;
       adjacent(k,n=>{
        if(e.step===k&&distance[n]===distance[k]-1)e.step=n;
       });
      }
      tx=cx(e.step);tz=cz(e.step);
     }
    }else e.step=-1;

    let mx=tx-p.x,mz=tz-p.z;
    for(const a of enemies)if(a!==e){
     const x=p.x-a.root.position.x,z=p.z-a.root.position.z,n=Math.hypot(x,z);
     if(n>.001&&n<.88){mx+=x/n*(.88-n)*.9;mz+=z/n*(.88-n)*.9;}
    }
    const len=Math.hypot(mx,mz);
    if(len>.03){
     const speed=[3.45,2.6,2.22,1.95][e.t]+mode*.19;
     const step=Math.min(len,speed*dt)/len;
     slide(p,p.x,p.z,mx*step,mz*step,.35);
     e.root.rotation.y=sees&&e.t?Math.atan2(dx,dz):Math.atan2(mx,mz);
     const stride=Math.sin(time*10+e.phase)*.58;
     e.legs[0].rotation.x=stride;e.legs[1].rotation.x=-stride;
     e.arms[0].rotation.x=-stride*.65;
     e.arms[1].rotation.x=e.t&&sees?-1.10:stride*.55;
    }
   }
  };

  // Стереопозиция звуков и шаги. Всё синтезируется через Web Audio.
  let lastStep=0;
  function noiseAt(gain,cutoff,duration,pan=0){
   if(!sound.ctx||muted||sound.ctx.state!=='running')return;
   const c=sound.ctx,t=c.currentTime,src=c.createBufferSource();
   const filter=c.createBiquadFilter(),g=c.createGain();
   src.buffer=sound.noise;filter.type='lowpass';filter.frequency.value=cutoff;
   src.connect(filter);filter.connect(g);
   g.gain.setValueAtTime(gain,t);
   g.gain.exponentialRampToValueAtTime(.001,t+duration);
   if(c.createStereoPanner){
    const p=c.createStereoPanner();p.pan.value=Math.max(-1,Math.min(1,pan));
    g.connect(p);p.connect(sound.master);
   }else g.connect(sound.master);
   src.start(t,0,duration);
  }
  function enemySound(p){
   const dx=p.x-player.x,dz=p.z-player.z,dist=Math.hypot(dx,dz);
   const vr=renderer.xr.isPresenting;
   // Правая сторона слушателя с поправкой на разворот головы в гарнитуре.
   const right=new T.Vector3(1,0,0);
   if(vr)right.applyQuaternion(headQ).applyAxisAngle(up,rig.rotation.y);
   else right.applyAxisAngle(up,yaw);
   const pan=(dx*right.x+dz*right.z)/Math.max(3,dist);
   const gain=.28/(1+dist*.072);
   noiseAt(gain,3100-dist*50,.13,pan);
   if(mapIndex===2)noiseAt(gain*.20,1200,.19,pan*.45);
  }
  const previousMove=movePlayer;
  movePlayer=function(dt,vr){
   previousMove(dt,vr);
   if(steps-lastStep>1.64){
    lastStep=steps;
    const metal=mapIndex===1||mapIndex===4;
    noiseAt(metal?.095:.078,metal?1040:630,.092);
   }
  };

  const previousStart=start;
  start=function(){
   previousStart();
   lastStep=0;resultNow=null;
   if(supplyLayer)supplyLayer.visible=true;
  };
  const previousProgress=progress;
  progress=function(dt){
   for(const s of supplies){
    if(s.used)continue;
    s.item.rotation.y+=dt*1.35;
    s.item.position.y=.53+Math.sin(time*3.1)*.11;
    const useful=s.type==='med'?health<=82:spare<=55;
    if(useful&&nearMarker(s,1.05)){
     s.used=true;s.g.visible=false;
     if(s.type==='med'){health=Math.min(100,health+28);notify('Аптечка · здоровье восстановлено');}
     else{spare+=16;notify('Боеприпасы · +16');}
     sfx('goal');
    }
   }
   previousProgress(dt);
  };
  function markerDistance(o){
   return Math.hypot(o.g.position.x-player.x,o.g.position.z-player.z);
  }
  function activeMarker(){
   if(exitOpen)return exitMarker;
   let nearest=null;
   for(const n of nodes)
    if(!n.done&&n.g.visible&&(!nearest||markerDistance(n)<markerDistance(nearest)))nearest=n;
   return nearest;
  }
  const previousGoal=goalText;
  goalText=function(){
   const base=previousGoal(), m=activeMarker();
   return state==='play'&&m?`${base} · ${Math.round(markerDistance(m))} м`:base;
  };
  const previousRadar=drawRadar;
  drawRadar=function(){
   previousRadar();
   for(const s of supplies){
    if(s.used||markerDistance(s)>10)continue;
    const x=mapCoord(s.g.position.x),z=mapCoord(s.g.position.z);
    rc.fillStyle=s.type==='med'?'#a5ffc3':'#b1d4ff';
    rc.fillRect(x-2,z-2,4,4);
   }
  };
  const previousHUD=updateHUD;
  let nextNav=0;
  updateHUD=function(force=false){
   previousHUD(force);
   const t=performance.now();
   if(!force&&t<nextNav)return;
   nextNav=t+90;
   if(state!=='play'||renderer.xr.isPresenting)return;
   const m=activeMarker();
   const dirs=['С','СЗ','З','ЮЗ','Ю','ЮВ','В','СВ'];
   const heading=dirs[(Math.round(yaw/(Math.PI/4))%8+8)%8];
   if(!m){nav.textContent=`Курс ${heading}`;return;}
   const dx=m.g.position.x-player.x,dz=m.g.position.z-player.z;
   const angle=Math.atan2(-dx,-dz)-yaw;
   const relative=Math.atan2(Math.sin(angle),Math.cos(angle));
   const arrow=Math.abs(relative)<.28?'↑':Math.abs(relative)>2.6?'↓':relative>0?'←':'→';
   nav.textContent=`Курс ${heading} · ${arrow} ${exitOpen?'Выход':'Цель'}`;
  };
 }

 let previous=0,lastShotController=null;
 const viewOffset=new T.Vector3();
 renderer.setAnimationLoop((stamp,frame)=>{
  const dt=previous?Math.max(0,Math.min(.05,(stamp-previous)/1000)):0;
  previous=stamp;
  const vr=renderer.xr.isPresenting;

  if(vr&&frame){
   const ref=renderer.xr.getReferenceSpace();
   const pose=ref&&frame.getViewerPose(ref);
   if(pose){
    head.copy(pose.transform.position);
    headQ.copy(pose.transform.orientation);
   }
   vrHud.position.copy(viewOffset.set(0,-.43,-1.55).applyQuaternion(headQ).add(head));
  }

  if(state==='play'){
   time+=dt;
   elapsed+=dt;
   movePlayer(dt,vr);
   checkSpawns();
   if(reloadEnd&&time>=reloadEnd){
    const n=Math.min(10-rounds,spare);
    rounds+=n;spare-=n;reloadEnd=0;
   }
   if(time>=nextRoute){
    refreshRoute();
    nextRoute=time+.23;
   }
  }

  const commands=pending.splice(0);
  for(const cmd of commands){
   if(state!=='play'){
    if(vr&&cmd.action==='fire'){
     advance();
     break;
    }
    continue;
   }
   if(cmd.action==='reload')reload();
   else{
    const old=blink;
    fire(cmd.controller);
    if(blink!==old)lastShotController=cmd.controller||null;
   }
  }

  if(state==='play'){
   enemiesStep(dt);
   if(state==='play'){
    progress(dt);
    for(const marker of markerList){
     if(!marker.g.visible)continue;
     marker.bob.rotation.y+=dt*.82;
     marker.bob.position.y=.75+Math.sin(time*2.7)*.14;
    }
   }
  }

  for(let i=transients.length-1;i>=0;i--){
   const tr=transients[i];
   const life=tr.end-time;
   if(life<=0||state!=='play'){
    world.remove(tr.o);
    tr.o.geometry.dispose();
    tr.o.material.dispose();
    transients.splice(i,1);
   }else tr.o.material.opacity=Math.min(.86,.86*life/tr.len);
  }

  if(rain?.visible&&mapIndex!==2){
   const attr=rain.geometry.attributes.position;
   for(let i=0;i<attr.array.length;i+=3){
    attr.array[i]+=.55*dt;
    attr.array[i+1]-=6.8*dt;
    if(attr.array[i+1]<0)attr.array[i+1]+=11;
    if(attr.array[i]>29)attr.array[i]-=58;
   }
   attr.needsUpdate=true;
  }

  kick=Math.max(0,kick-dt*8.5);
  const flashing=state==='play'&&time<blink;
  weapon.muzzle.visible=!vr&&flashing;
  weapon.g.position.y=-.215+Math.sin(steps*2)*.007;
  weapon.g.position.z=weapon.z+kick*.045;
  const reloadPhase=reloadEnd?Math.max(0,1-(reloadEnd-time)/.95):0;
  weapon.g.rotation.x=kick*.11-Math.sin(Math.PI*reloadPhase)*.62;
  for(const v of vrWeapons)v.muzzle.visible=vr&&flashing&&v.g.parent===lastShotController;

  $('aim').classList.toggle('hit',time<hitMark);
  $('damage').style.boxShadow=!vr&&state==='play'&&time<hurtAt
   ?'inset 0 0 120px #f4496288':'none';
  updateHUD();
  renderer.render(scene,cam);
 });

 frontMenu();
 renderQuality();
 if(rain)rain.visible=quality()&&mapIndex!==2;
 detectVR();
}
</script>
</body>
